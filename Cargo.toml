[package]
name = "oasis"
version = "0.1.0"
edition = "2024"
description = "In-memory hybrid (dense + BM25) search over markdown docs, exposed as an MCP tool for AI models."
license = "MIT"

[[bin]]
name = "oasis"
path = "src/main.rs"

[dependencies]
# CLI / runtime
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Corpus ingestion
walkdir = "2.5"
pulldown-cmark = "0.13"

# Lexical search
unicode-segmentation = "1.13"
rust-stemmers = "1.2"

# Dense search
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "1.0", features = ["blocking", "rustls-tls"] }
ndarray = "0.17"

# Embedding cache
blake3 = "1"
bincode = "1.3"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
